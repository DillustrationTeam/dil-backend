name: 📄 Export OpenAPI → Deploy Scalar Docs to Netlify

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/ArtCommission.API/**'
      - 'src/ArtCommission.Application/**'
      - 'src/ArtCommission.Domain/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  export-and-deploy:
    name: Export OpenAPI JSON & Deploy Scalar Docs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 📦 Restore NuGet packages
        run: dotnet restore ArtCommission.sln

      - name: 🏗️ Build & export openapi.json (build-time, không cần DB)
        # Microsoft.Extensions.ApiDescription.Server tự generate openapi.json
        # vào $(OutputPath) = bin/Release/net8.0/ trong lúc build — không cần app chạy.
        run: |
          dotnet build ArtCommission.sln \
            --no-restore \
            --configuration Release \
            -p:OpenApiGenerateDocumentsOnBuild=true

      - name: 📤 Copy openapi.json vào scalar-site
        run: |
          mkdir -p scalar-site
          cp src/ArtCommission.API/obj/ArtCommission.API.json scalar-site/openapi.json

      - name: 🔧 Install Netlify CLI
        run: npm install -g netlify-cli

      - name: 🔐 Kiểm tra cấu hình triển khai Netlify
        id: netlify_secrets
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_SITE_ID" ] || [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "Bỏ qua triển khai Netlify vì thiếu NETLIFY_SITE_ID hoặc NETLIFY_AUTH_TOKEN."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🌐 Deploy to Netlify
        if: ${{ steps.netlify_secrets.outputs.enabled == 'true' }}
        run: |
          echo "Deploying Scalar Docs to Netlify..."
          netlify deploy \
            --dir=scalar-site \
            --prod \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
